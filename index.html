.header-text p  { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 1px; }
.online-dot {

  display: flex; align-items: center; gap: 6px;

}
.online-dot::before {

  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
 
.progress-wrap {
  padding: 12px 22px 0;
  display: flex; align-items: center; gap: 10px;
}
.progress-bar {
  flex: 1; height: 4px; background: rgba(255,255,255,0.15);
  border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #3B82F6, #0891B2);
  transition: width 0.5s ease;
}
.progress-label { font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; }
 
.messages {

  scroll-behavior: smooth;

.messages::-webkit-scrollbar { width: 4px; }

.msg { display: flex; gap: 10px; animation: popIn .28s ease; }

.msg.user { flex-direction: row-reverse; }
 
.av {

.bubble {

  border-radius: var(--radius); font-size: 14.5px; line-height: 1.7;
}
.bubble.bot {
  background: var(--surface); border: 1px solid var(--border);

  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.bubble.user {
  background: linear-gradient(135deg, var(--navy), var(--blue));

}
 
.bubble strong { color: var(--blue); }

.bubble .info-box {
  background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 9px;

}
.bubble .warn-box {
  background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 9px;
  padding: 11px 14px; margin: 10px 0; font-size: 13px; color: #78350F;
}
.bubble .success-box {
  background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 9px;
  padding: 11px 14px; margin: 10px 0; font-size: 13px; color: #14532D;
}
.ts { font-size: 11px; color: var(--text3); margin-top: 4px; }
.msg.user .ts { text-align: right; }
 
/* UPLOAD CARD */
.upload-card {
  background: var(--surface); border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 18px 20px; margin: 4px 0;
  transition: border-color .2s, background .2s;
}
.upload-card.has-file { border-color: var(--green); border-style: solid; background: #F0FDF4; }
.upload-card.error    { border-color: var(--red);   border-style: solid; background: #FEF2F2; }
 
.upload-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.upload-icon { font-size: 28px; }
.upload-title { font-size: 14px; font-weight: 700; }
.upload-sub   { font-size: 12px; color: var(--text2); margin-top: 2px; }
 
.upload-zone {
  border: 1.5px dashed #CBD5E1; border-radius: 10px;
  padding: 14px; text-align: center; cursor: pointer;
  background: var(--bg); transition: all .2s;
  position: relative;
}
.upload-zone:hover { border-color: var(--blue); background: #EFF6FF; }
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.upload-zone .zone-text { font-size: 13px; color: var(--text3); pointer-events: none; }
.upload-zone .zone-icon { font-size: 24px; margin-bottom: 4px; }
 
.file-preview {
  display: flex; align-items: center; gap: 10px; padding: 10px 13px;
  background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 9px;
  margin-top: 8px; font-size: 13px;
}
.file-preview .fp-name { font-weight: 600; color: var(--green); flex: 1; }
.file-preview .fp-remove {
  cursor: pointer; color: var(--text3); font-size: 16px; line-height: 1;
  padding: 2px 6px; border-radius: 4px; transition: background .15s;
}
.file-preview .fp-remove:hover { background: #FEE2E2; color: var(--red); }
 
.upload-tip { font-size: 11.5px; color: var(--text3); margin-top: 8px; line-height: 1.5; }
 
/* ID VALIDATION */
.id-input-wrap { position: relative; }
.id-status-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 16px; pointer-events: none;
}
.id-hint {
  font-size: 11.5px; margin-top: 5px; padding: 6px 10px;

}
.id-hint.valid   { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; display: block; }
.id-hint.invalid { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; display: block; }
.id-hint.warn    { background: #FFFBEB; color: #78350F; border: 1px solid #FDE68A; display: block; }
 
/* FORM CARD */
.form-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin: 4px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.form-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 16px; color: var(--navy); }
 
.field-group { margin-bottom: 14px; }
.field-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
.field-group label span.req { color: var(--red); margin-right: 2px; }
.field-group input,
.field-group select,
.field-group textarea {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: 9px;
  font-family: 'Heebo', sans-serif; font-size: 14px; color: var(--text);
  background: var(--bg); outline: none; transition: border-color .2s, box-shadow .2s;
  direction: rtl;
}
.field-group input:focus,
.field-group select:focus,
.field-group textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(29,95,212,0.1);
  background: #fff;
}
.field-group input.err, .field-group select.err { border-color: var(--red); box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
.field-group input.valid-id { border-color: var(--green); box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
.field-err { font-size: 11.5px; color: var(--red); margin-top: 4px; display: none; }
 
.field-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
 
.submit-btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
  background: linear-gradient(135deg, var(--navy), var(--blue));
  color: #fff; font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 700;
  transition: all .2s; box-shadow: 0 4px 16px rgba(29,95,212,0.35);
  margin-top: 6px;
}
.submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(29,95,212,0.45); }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; }
 
/* PRODUCT CHOICE */
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 6px 0; }
.choice-btn {
  padding: 13px 10px; border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--bg); cursor: pointer; font-family: 'Heebo', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--text2);
  transition: all .18s; text-align: center;
}
.choice-btn:hover { border-color: var(--blue); color: var(--blue); background: #EFF6FF; }
.choice-btn.selected { border-color: var(--blue); background: #EFF6FF; color: var(--blue); }
.choice-btn .cb-icon { font-size: 24px; display: block; margin-bottom: 5px; }
 
/* QUICK REPLIES */
.qr-wrap { padding: 0 18px 10px; display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
.qr-btn {
  padding: 8px 15px; border: 1.5px solid var(--border); border-radius: 20px;
  background: var(--surface); cursor: pointer; font-size: 13px; color: var(--text2);
  font-family: 'Heebo', sans-serif; transition: all .15s;
}
.qr-btn:hover { border-color: var(--blue); color: var(--blue); background: #EFF6FF; }
 
/* INPUT */
.input-area {
  padding: 12px 16px 16px;
  background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
}
.input-row { display: flex; gap: 10px; align-items: flex-end; }
.input-box {
  flex: 1; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 11px 15px; display: flex; align-items: center;
  transition: border-color .2s, box-shadow .2s;
}
.input-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,95,212,0.1); }

  max-height: 90px; line-height: 1.5; color: var(--text);
}
textarea#userInput::placeholder { color: var(--text3); }
 
.send-btn {
  width: 44px; height: 44px; border: none; cursor: pointer; border-radius: 11px;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  color: #fff; font-size: 19px; display: flex; align-items: center; justify-content: center;
  transition: all .18s; box-shadow: 0 3px 12px rgba(29,95,212,0.35); flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { transform: scale(1.07) translateY(-1px); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
 
/* Typing */
.typing { display: flex; gap: 10px; }
.dot-w { display: flex; gap: 5px; align-items: center; padding: 5px 0; }
.dot-w span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
  animation: dw 1.2s ease-in-out infinite;
}
.dot-w span:nth-child(2) { animation-delay:.15s; }
.dot-w span:nth-child(3) { animation-delay:.3s; }
@keyframes dw { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
 
/* SENDING OVERLAY */
.sending-overlay {
  display: none;
  position: absolute; inset: 0;
  background: rgba(15,36,68,0.85);
  backdrop-filter: blur(4px);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  border-radius: inherit;
}
.sending-overlay.show { display: flex; }
.sending-spinner {
  width: 56px; height: 56px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: #3B82F6;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.sending-text { color: #fff; font-size: 15px; font-weight: 600; }
.sending-sub  { color: rgba(255,255,255,0.6); font-size: 12px; }
 
/* SUCCESS SCREEN */
.success-screen {
  display: none; flex-direction: column; align-items: center; justify-content: center;

.success-screen.show { display: flex; }
.success-icon { font-size: 72px; animation: bounceIn .6s cubic-bezier(.34,1.56,.64,1); }

.success-screen h2 { font-size: 22px; font-weight: 900; color: var(--navy); }
.success-screen p  { font-size: 14px; color: var(--text2); line-height: 1.7; max-width: 340px; }
 
.new-lead-btn {
  padding: 11px 24px; border: 1.5px solid var(--border); border-radius: 20px;
  background: transparent; cursor: pointer; font-family: 'Heebo', sans-serif;
  font-size: 13px; color: var(--text2); margin-top: 4px; transition: all .15s;
}
.new-lead-btn:hover { border-color: var(--blue); color: var(--blue); }
 
/* DOCS CHECKLIST */
.docs-checklist {
  background: #F8FAFC; border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; margin: 8px 0;
}
.docs-checklist-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
.doc-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px;
}
.doc-item:last-child { border-bottom: none; }
.doc-item .doc-status { font-size: 16px; flex-shrink: 0; }
.doc-item .doc-name { flex: 1; color: var(--text2); }
.doc-item.done .doc-name { color: var(--green); font-weight: 600; }
.doc-item.missing .doc-name { color: var(--red); }
</style>

function validateIsraeliID(id) {
  const cleaned = id.replace(/[-\s]/g, '');
  if (!/^\d{9}$/.test(cleaned)) return { valid: false, reason: 'ת"ז חייבת להכיל 9 ספרות בדיוק' };
  if (/^(\d)\1{8}$/.test(cleaned)) return { valid: false, reason: 'מספר ת"ז לא תקין – ספרות זהות' };
  if (cleaned === '000000000') return { valid: false, reason: 'מספר ת"ז לא תקין' };
  let sum = 0;
  for (let i = 0; i < 9; i++) {
    let v = parseInt(cleaned[i]) * ((i % 2) + 1);
    if (v > 9) v -= 9;
    sum += v;
  }
  if (sum % 10 !== 0) return { valid: false, reason: 'ספרת הביקורת אינה תקינה – בדוק שהקלדת נכון' };
  return { valid: true };
}
 
function onIDInput(inputEl) {
  const raw = inputEl.value;
  const cleaned = raw.replace(/\D/g, '').slice(0, 9);
  if (raw !== cleaned) inputEl.value = cleaned;
  const hint = document.getElementById('id-hint');
  const icon = document.getElementById('id-status-icon');
  if (cleaned.length === 0) {
    hint.className = 'id-hint'; hint.textContent = '';
    icon.textContent = ''; inputEl.className = '';
    return;
  }
  if (cleaned.length < 9) {
    hint.className = 'id-hint warn';
    hint.textContent = `הוזנו ${cleaned.length} מתוך 9 ספרות`;
    icon.textContent = '🔢'; inputEl.className = '';
    return;
  }
  const result = validateIsraeliID(cleaned);
  if (result.valid) {
    hint.className = 'id-hint valid';
    hint.textContent = '✓ מספר ת"ז תקין';
    icon.textContent = '✅';
    inputEl.classList.remove('err'); inputEl.classList.add('valid-id');
  } else {
    hint.className = 'id-hint invalid';
    hint.textContent = '✗ ' + result.reason;
    icon.textContent = '❌';
    inputEl.classList.remove('valid-id'); inputEl.classList.add('err');
  }
}

async function askAI(userMsg) {
  aiHistory.push({ role: 'user', content: userMsg });
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 300,
        system: AI_SYSTEM,
        messages: aiHistory
      })
    });
    const d = await r.json();
    const reply = d.content?.[0]?.text || 'מצטער, נסה שוב.';
    aiHistory.push({ role: 'assistant', content: reply });
    return reply;
  } catch(e) { return 'שגיאת חיבור – נסה שנית.'; }

function handleFile(field, uid, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    alert('הקובץ גדול מ-5MB. אנא דחוס את הקובץ ונסה שנית.');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    // ── שמירה מאובטחת של הנתון ──
    const dataUrl = e.target.result;
    if (!dataUrl || !dataUrl.includes(',')) {
      alert('שגיאה בקריאת הקובץ. אנא נסה שנית.');
      return;
    }
    state[field] = { name: file.name, dataUrl: dataUrl, type: file.type };
 
    // ── עדכון UI ──
    const card = document.getElementById(uid+'_card');
    if (card) card.classList.add('has-file');
    const zone = document.getElementById(uid+'_zone');
    if (zone) zone.style.display = 'none';
    const preview = document.getElementById(uid+'_preview');
    if (preview) preview.innerHTML = `
      <div class="file-preview">
        <span>✅</span>
        <span class="fp-name">${file.name}</span>
        <span class="fp-remove" onclick="removeFile('${field}','${uid}')">✕</span>
      </div>`;
 
    // ── מעבר לשלב הבא רק אחרי שהנתון נשמר ──
    console.log('File saved:', field, '| name:', file.name, '| state ok:', !!state[field]);
 
    setTimeout(() => {
      if (field === 'id_front') {
        if (state.id_type === 'old') {
          // ת"ז ישנה – צד אחורי לא נדרש
          state.id_back = null;
          step3_bank();
        } else {
          // ת"ז ביומטרית – צריך גם צד אחורי
          step2_idBack();
        }
      } else if (field === 'id_back') {
        step3_bank();
      } else if (field === 'bank_doc') {
        const needsPension = state.product === 'קרן פנסיה' || state.product === 'ביטוח מנהלים';
        if (needsPension) {
          step3b_termination();
        } else {
          step4_details();
        }
      } else if (field === 'termination_doc') {
        step3c_form161();
      } else if (field === 'form161_doc') {
        step4_details();
      }
    }, 700);
  };
 
  reader.onerror = () => {
    alert('שגיאה בקריאת הקובץ. אנא נסה קובץ אחר.');
  };
 
  reader.readAsDataURL(file);
}
 
function removeFile(field, uid) {
  state[field] = null;
  const card = document.getElementById(uid+'_card');
  if (card) card.classList.remove('has-file');
  const zone = document.getElementById(uid+'_zone');
  if (zone) zone.style.display = '';
  const preview = document.getElementById(uid+'_preview');
  if (preview) preview.innerHTML = '';
}

          <label>מספר ת"ז <span class="req">*</span></label>
          <div class="id-input-wrap">
            <input type="text" id="f_id" placeholder="012345678" maxlength="9"
              oninput="onIDInput(this)" autocomplete="off" inputmode="numeric">
            <span class="id-status-icon" id="id-status-icon"></span>
          </div>
          <div class="id-hint" id="id-hint"></div>
          <div class="field-err" id="err_f_id" style="display:none"></div>
        </div>
      </div>
 
      <div class="field-group">
        <label>שם חברה מנהלת / גוף</label>
        <input type="text" id="f_company" placeholder="אנליסט, מור, מיטב דש, הפניקס, מנורה, הראל, מגדל, כלל, ילין לפיד...">
      </div>
 
      <div class="field-group">
        <label>הערות / פרטים נוספים</label>
        <textarea id="f_notes" rows="2" placeholder="למשל: פדיון חלקי, גיל פרישה, מספר פוליסה..." style="resize:none"></textarea>
      </div>
 
      <div id="docs-summary" class="docs-checklist" style="margin-bottom:14px"></div>
 
      <div class="field-group" style="display:flex;gap:8px;align-items:center">
        <input type="checkbox" id="f_consent" style="width:18px;height:18px;cursor:pointer;flex-shrink:0">
        <label for="f_consent" style="font-size:12.5px;color:var(--text2);cursor:pointer;margin:0">
          אני מאשר/ת שהפרטים שמסרתי נכונים ומסכים/ה לטיפול בפנייתי
        </label>
      </div>
      <div class="field-err" id="err_consent">יש לאשר את התנאים</div>
 
      <button class="submit-btn" onclick="submitLead()">שלח פנייה לנציג →</button>
    </div>
    <div class="ts">${ts()}</div>
  </div>`;
  m.appendChild(d); scrollEnd();
  document.getElementById('inputArea').style.display = 'none';
  buildDocsSummary();
}
 
function buildDocsSummary() {
  const el = document.getElementById('docs-summary');
  if (!el) return;
  const needsPension = state.product === 'קרן פנסיה' || state.product === 'ביטוח מנהלים';
  const docs = [
    { field: 'id_front', label: state.id_type === 'old' ? 'ת"ז – צד קדמי' : 'ת"ז ביומטרית – צד קדמי' },
  ];
  if (state.id_type === 'biometric') {
    docs.push({ field: 'id_back', label: 'ת"ז ביומטרית – צד אחורי' });
  }
  docs.push({ field: 'bank_doc', label: 'אישור ניהול חשבון / שיק מבוטל' });
  if (needsPension) {
    docs.push({ field: 'termination_doc', label: 'אישור סיום עבודה' });
    docs.push({ field: 'form161_doc', label: 'טופס 161 / אישור מס הכנסה' });
  }
  el.innerHTML = `<div class="docs-checklist-title">📎 מסמכים שהועלו</div>` +
    docs.map(d => {
      const uploaded = !!state[d.field];
      return `<div class="doc-item ${uploaded ? 'done' : 'missing'}">
        <span class="doc-status">${uploaded ? '✅' : '❌'}</span>
        <span class="doc-name">${d.label}</span>
        ${uploaded ? `<span style="font-size:11px;color:var(--text3)">${state[d.field].name}</span>` : ''}
      </div>`;
    }).join('');
}
 
function clearErr(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('err');
  const er = document.getElementById('err_'+id);
  if (er) er.style.display = 'none';
}
function showErr(id, msg) {
  const el = document.getElementById(id);
  if (el) el.classList.add('err');
  const er = document.getElementById('err_'+id);
  if (er) { er.textContent = msg||'שדה חובה'; er.style.display = 'block'; }
}
 
// ════════════════════════════════════════════
//  SUBMIT
// ════════════════════════════════════════════
async function submitLead() {
  const name    = document.getElementById('f_name').value.trim();
  const idNum   = document.getElementById('f_id').value.trim();
  const company = document.getElementById('f_company').value.trim();
  const notes   = document.getElementById('f_notes').value.trim();
  const consent = document.getElementById('f_consent').checked;
 
  let ok = true;
  if (!name) { showErr('f_name'); ok = false; }
 
  const idValidation = validateIsraeliID(idNum);
  if (!idValidation.valid) {
    showErr('f_id', idValidation.reason || 'ת"ז לא תקינה (9 ספרות)');
    ok = false;
  }
  if (!consent) { showErr('consent', 'יש לאשר את התנאים'); ok = false; }
 
  // ── בדיקת מסמכים לפי סוג ת"ז ומוצר ──
  const needsPension = state.product === 'קרן פנסיה' || state.product === 'ביטוח מנהלים';
  const missingDocs = [];
 
  if (!state.id_front) missingDocs.push('תעודת זהות – צד קדמי');
  if (state.id_type === 'biometric' && !state.id_back) missingDocs.push('ת"ז ביומטרית – צד אחורי');
  if (!state.bank_doc) missingDocs.push('אישור ניהול חשבון / שיק מבוטל');
  if (needsPension && !state.termination_doc) missingDocs.push('אישור סיום עבודה');
  if (needsPension && !state.form161_doc) missingDocs.push('טופס 161 / אישור מס הכנסה');
 
  if (missingDocs.length > 0) {
    addMsg(`❗ חסרים המסמכים הבאים:<br>• ${missingDocs.join('<br>• ')}<br><br>יש לחזור ולהעלות לפני השליחה.`);
    buildDocsSummary();
    return;
  }
 
  if (!ok) return;
 
  state.name = name; state.id_number = idNum; state.company = company; state.notes = notes;
 
  document.getElementById('sendingOverlay').classList.add('show');
 
  // ── docPayload מוגן ──
  function docPayload(docObj) {
    if (!docObj || !docObj.dataUrl) return null;
    const parts = docObj.dataUrl.split(',');
    if (parts.length < 2) return null;
    const base64 = parts[1];
    if (!base64) return null;
    return {
      filename:   docObj.name,
      mime_type:  docObj.type,
      data_base64: base64,
      size_bytes: Math.round(base64.length * 0.75)
    };
  }
 
  // ── בניית payload לפי סוג ת"ז ומוצר ──
  const webhookPayload = {
    submitted_at: new Date().toISOString(),
    source: 'pedion-chatbot',
    personal_info: {
      full_name:       name,
      id_number:       idNum,
      company_manager: company || null,
      notes:           notes   || null,
    },
    product: state.product,
    id_type: state.id_type === 'old' ? 'ת"ז ישנה' : 'ת"ז ביומטרית',
    documents: {
      id_front:        docPayload(state.id_front),
      id_back:         state.id_type === 'biometric' ? docPayload(state.id_back) : null,
      bank_document:   docPayload(state.bank_doc),
      termination_doc: needsPension ? docPayload(state.termination_doc) : null,
      form_161:        needsPension ? docPayload(state.form161_doc)     : null,
    }
  };
 
  // ── לוג לדיבאג ──
  console.log('=== WEBHOOK PAYLOAD SUMMARY ===');
  console.log('Product:', webhookPayload.product);
  console.log('ID Type:', webhookPayload.id_type);
  console.log('Docs:', {
    id_front:        !!webhookPayload.documents.id_front,
    id_back:         webhookPayload.documents.id_back !== null ? !!webhookPayload.documents.id_back : 'לא רלוונטי',
    bank_document:   !!webhookPayload.documents.bank_document,
    termination_doc: webhookPayload.documents.termination_doc !== null ? !!webhookPayload.documents.termination_doc : 'לא רלוונטי',
    form_161:        webhookPayload.documents.form_161 !== null ? !!webhookPayload.documents.form_161 : 'לא רלוונטי',
  });
 
  // ── שליחה ל-Webhook ──
  let webhookOk = false;
  try {
    const res = await fetch(OFFICE_CONFIG.webhook_url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(webhookPayload)
    });
    webhookOk = res.ok;
    if (!res.ok) console.warn('Webhook response:', res.status, await res.text());
    else console.log('Webhook sent successfully');
  } catch(e) {
    console.error('Webhook error:', e);
  }
 
  // ── EmailJS fallback ──
  try {
    emailjs.init(OFFICE_CONFIG.emailjs_public_key);
    const idBackLine = state.id_type === 'biometric'
      ? 'ת"ז אחורי: '  + (state.id_back ? '✅ ' + state.id_back.name : '❌ חסר') + '\n'
      : 'ת"ז אחורי: לא נדרש (ת"ז ישנה)\n';
 
    await emailjs.send(
      OFFICE_CONFIG.emailjs_service_id,
      OFFICE_CONFIG.emailjs_template_id,
      {
        name,
        id_num:   idNum,
        phone:    '—',
        email:    '—',
        product:  state.product,
        company:  company || '—',
        id_type:  state.id_type === 'old' ? 'ת"ז ישנה' : 'ת"ז ביומטרית',
        notes:    notes   || '—',
        docs_list:
            'ת"ז קדמי: '     + (state.id_front        ? '✅ ' + state.id_front.name        : '❌ חסר') + '\n'
          + idBackLine
          + 'אישור חשבון: '  + (state.bank_doc         ? '✅ ' + state.bank_doc.name        : '❌ חסר') + '\n'
          + (needsPension ? 'אישור סיום: '  + (state.termination_doc ? '✅ ' + state.termination_doc.name : '❌ חסר') + '\n' : '')
          + (needsPension ? 'טופס 161: '    + (state.form161_doc     ? '✅ ' + state.form161_doc.name    : '❌ חסר') + '\n' : ''),
        sent_at:        new Date().toLocaleString('he-IL'),
        webhook_status: webhookOk ? 'נשלח בהצלחה' : 'שגיאה בשליחה',
      }
    );
  } catch(e) { console.warn('EmailJS error:', e); }
 
  // ── הצגת מסך הצלחה ──
  document.getElementById('sendingOverlay').classList.remove('show');
  document.getElementById('messages').style.display   = 'none';
  document.getElementById('qrWrap').style.display     = 'none';
  document.getElementById('inputArea').style.display  = 'none';
  document.getElementById('successScreen').classList.add('show');
  document.getElementById('respHours').textContent = OFFICE_CONFIG.response_hours;
}
 
// ════════════════════════════════════════════
//  FREE TEXT / RESET
// ════════════════════════════════════════════
async function sendFree() {
  if (busy) return;
  const inp = document.getElementById('userInput');
  const txt = inp.value.trim(); if (!txt) return;
  busy = true; document.getElementById('sendBtn').disabled = true;
  inp.value = ''; inp.style.height = 'auto';
  clearQR(); addUserMsg(txt); showTyping();
  const reply = await askAI(txt);
  hideTyping(); addMsg(reply.replace(/\n/g,'<br>'));
  busy = false; document.getElementById('sendBtn').disabled = false;
}
 
function handleQR(txt) { document.getElementById('userInput').value = txt; sendFree(); }
 
function resetAll() {
  Object.assign(state, {
    product:'', id_type:'',
    id_front:null, id_back:null, bank_doc:null,
    termination_doc:null, form161_doc:null,
    name:'', id_number:'', company:'', notes:''
  });
  aiHistory = [];
  document.getElementById('successScreen').classList.remove('show');
  document.getElementById('messages').style.display  = '';
  document.getElementById('messages').innerHTML      = '';
  document.getElementById('qrWrap').style.display    = '';
  document.getElementById('inputArea').style.display = '';
  start();
}
 
window.onload = () => {
  document.getElementById('respHours').textContent = OFFICE_CONFIG.response_hours;
  start();
};
</script>
