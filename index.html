<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F0F4FA;
  --surface:   #FFFFFF;
  --navy:      #0F2444;
  --navy2:     #1A3A6B;
  --blue:      #1D5FD4;
  --blue2:     #3B82F6;
  --teal:      #0891B2;
  --green:     #059669;
  --amber:     #D97706;
  --red:       #DC2626;
  --text:      #1E293B;
  --text2:     #475569;
  --text3:     #94A3B8;
  --border:    #E2E8F0;
  --radius:    16px;
  --radius-sm: 10px;
  --shadow:    0 4px 24px rgba(0,0,0,0.08);
}

body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

/* ── WRAPPER ── */
.chat-wrapper {
  width: 100%;
  max-width: 580px;
  height: 100vh;
  max-height: 820px;
  background: var(--surface);
  border-radius: 0;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
@media (min-width: 620px) {
  .chat-wrapper { border-radius: 24px; height: 92vh; }
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  padding: 20px 22px 16px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute; top: -60px; left: -60px;
  width: 200px; height: 200px; border-radius: 50%;
  background: rgba(255,255,255,0.04);
  pointer-events: none;
}
.header-row { display: flex; align-items: center; gap: 13px; }
.header-logo {
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  background: linear-gradient(135deg, #1D5FD4, #0891B2);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 3px 14px rgba(29,95,212,0.5);
}
.header-text h1 { font-size: 17px; font-weight: 800; color: #fff; }
.header-text p  { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 1px; }
.online-dot {
  margin-right: auto;
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: #6EE7B7; font-weight: 500;
}
.online-dot::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: #10B981; box-shadow: 0 0 6px #10B981;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Progress bar */
.progress-wrap {
  padding: 12px 22px 0;
  display: flex; align-items: center; gap: 10px;
}
.progress-bar {
  flex: 1; height: 4px; background: rgba(255,255,255,0.15);
  border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #3B82F6, #0891B2);
  transition: width 0.5s ease;
}
.progress-label { font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; }

/* ── MESSAGES ── */
.messages {
  flex: 1; overflow-y: auto;
  padding: 20px 18px 12px;
  display: flex; flex-direction: column; gap: 14px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Bubbles */
.msg { display: flex; gap: 10px; animation: popIn .28s ease; }
@keyframes popIn {
  from { opacity: 0; transform: translateY(8px) scale(.97); }
  to   { opacity: 1; transform: none; }
}
.msg.user { flex-direction: row-reverse; }

.av {
  width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; margin-top: 3px;
}
.av.bot  { background: #EFF6FF; border: 1px solid #BFDBFE; }
.av.user-av { background: linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; font-size:12px; font-weight:700; }

.bubble {
  max-width: 78%; padding: 13px 17px;
  border-radius: var(--radius); font-size: 14.5px; line-height: 1.7;
}
.bubble.bot {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-top-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.bubble.user {
  background: linear-gradient(135deg, var(--navy), var(--blue));
  color: #fff; border-top-left-radius: 4px;
}

/* Rich bubble helpers */
.bubble strong { color: var(--blue); }
.bubble.user strong { color: #BAE6FD; }
.bubble .info-box {
  background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 9px;
  padding: 11px 14px; margin: 10px 0; font-size: 13px; color: var(--navy2);
}
.bubble .warn-box {
  background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 9px;
  padding: 11px 14px; margin: 10px 0; font-size: 13px; color: #78350F;
}
.bubble .success-box {
  background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 9px;
  padding: 11px 14px; margin: 10px 0; font-size: 13px; color: #14532D;
}
.ts { font-size: 11px; color: var(--text3); margin-top: 4px; }
.msg.user .ts { text-align: right; }

/* ── DOCUMENT UPLOAD CARD ── */
.upload-card {
  background: var(--surface); border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 18px 20px; margin: 4px 0;
  transition: border-color .2s, background .2s;
}
.upload-card.has-file { border-color: var(--green); border-style: solid; background: #F0FDF4; }
.upload-card.error    { border-color: var(--red);   border-style: solid; background: #FEF2F2; }

.upload-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.upload-icon { font-size: 28px; }
.upload-title { font-size: 14px; font-weight: 700; }
.upload-sub   { font-size: 12px; color: var(--text2); margin-top: 2px; }

.upload-zone {
  border: 1.5px dashed #CBD5E1; border-radius: 10px;
  padding: 14px; text-align: center; cursor: pointer;
  background: var(--bg); transition: all .2s;
  position: relative;
}
.upload-zone:hover { border-color: var(--blue); background: #EFF6FF; }
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.upload-zone .zone-text { font-size: 13px; color: var(--text3); pointer-events: none; }
.upload-zone .zone-icon { font-size: 24px; margin-bottom: 4px; }

.file-preview {
  display: flex; align-items: center; gap: 10px; padding: 10px 13px;
  background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 9px;
  margin-top: 8px; font-size: 13px;
}
.file-preview .fp-name { font-weight: 600; color: var(--green); flex: 1; }
.file-preview .fp-remove {
  cursor: pointer; color: var(--text3); font-size: 16px; line-height: 1;
  padding: 2px 6px; border-radius: 4px; transition: background .15s;
}
.file-preview .fp-remove:hover { background: #FEE2E2; color: var(--red); }

.upload-tip { font-size: 11.5px; color: var(--text3); margin-top: 8px; line-height: 1.5; }

/* ── FORM CARD ── */
.form-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin: 4px 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.form-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 16px; color: var(--navy); }

.field-group { margin-bottom: 14px; }
.field-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
.field-group label span.req { color: var(--red); margin-right: 2px; }
.field-group input,
.field-group select,
.field-group textarea {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: 9px;
  font-family: 'Heebo', sans-serif; font-size: 14px; color: var(--text);
  background: var(--bg); outline: none; transition: border-color .2s, box-shadow .2s;
}
.field-group input:focus,
.field-group select:focus,
.field-group textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(29,95,212,0.1);
  background: #fff;
}
.field-group input.err, .field-group select.err { border-color: var(--red); }
.field-err { font-size: 11.5px; color: var(--red); margin-top: 4px; display: none; }

.field-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.submit-btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
  background: linear-gradient(135deg, var(--navy), var(--blue));
  color: #fff; font-family: 'Heebo', sans-serif; font-size: 16px; font-weight: 700;
  transition: all .2s; box-shadow: 0 4px 16px rgba(29,95,212,0.35);
  margin-top: 6px;
}
.submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(29,95,212,0.45); }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── PRODUCT CHOICE ── */
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 6px 0; }
.choice-btn {
  padding: 13px 10px; border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--bg); cursor: pointer; font-family: 'Heebo', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--text2);
  transition: all .18s; text-align: center;
}
.choice-btn:hover { border-color: var(--blue); color: var(--blue); background: #EFF6FF; }
.choice-btn.selected { border-color: var(--blue); background: #EFF6FF; color: var(--blue); }
.choice-btn .cb-icon { font-size: 24px; display: block; margin-bottom: 5px; }

/* ── QUICK REPLIES ── */
.qr-wrap { padding: 0 18px 10px; display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
.qr-btn {
  padding: 8px 15px; border: 1.5px solid var(--border); border-radius: 20px;
  background: var(--surface); cursor: pointer; font-size: 13px; color: var(--text2);
  font-family: 'Heebo', sans-serif; transition: all .15s;
}
.qr-btn:hover { border-color: var(--blue); color: var(--blue); background: #EFF6FF; }

/* ── INPUT ── */
.input-area {
  padding: 12px 16px 16px;
  background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
}
.input-row { display: flex; gap: 10px; align-items: flex-end; }
.input-box {
  flex: 1; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 11px 15px; display: flex; align-items: center;
  transition: border-color .2s, box-shadow .2s;
}
.input-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,95,212,0.1); }
textarea#userInput {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Heebo', sans-serif; font-size: 15px; resize: none;
  max-height: 90px; line-height: 1.5; color: var(--text);
}
textarea#userInput::placeholder { color: var(--text3); }

.send-btn {
  width: 44px; height: 44px; border: none; cursor: pointer; border-radius: 11px;
  background: linear-gradient(135deg, var(--blue), var(--teal));
  color: #fff; font-size: 19px; display: flex; align-items: center; justify-content: center;
  transition: all .18s; box-shadow: 0 3px 12px rgba(29,95,212,0.35); flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { transform: scale(1.07) translateY(-1px); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }

/* Typing */
.typing { display: flex; gap: 10px; }
.dot-w { display: flex; gap: 5px; align-items: center; padding: 5px 0; }
.dot-w span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
  animation: dw 1.2s ease-in-out infinite;
}
.dot-w span:nth-child(2) { animation-delay:.15s; }
.dot-w span:nth-child(3) { animation-delay:.3s; }
@keyframes dw { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

/* ── SUCCESS SCREEN ── */
.success-screen {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; padding: 32px 28px; text-align: center; gap: 16px;
}
.success-screen.show { display: flex; }
.success-icon { font-size: 72px; animation: bounceIn .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes bounceIn { from{opacity:0;transform:scale(.4)} to{opacity:1;transform:scale(1)} }
.success-screen h2 { font-size: 22px; font-weight: 900; color: var(--navy); }
.success-screen p  { font-size: 14px; color: var(--text2); line-height: 1.7; max-width: 340px; }



.new-lead-btn {
  padding: 11px 24px; border: 1.5px solid var(--border); border-radius: 20px;
  background: transparent; cursor: pointer; font-family: 'Heebo', sans-serif;
  font-size: 13px; color: var(--text2); margin-top: 4px; transition: all .15s;
}
.new-lead-btn:hover { border-color: var(--blue); color: var(--blue); }
</style>
</head>

const STEPS_TOTAL = 4;

function setProgress(s) {
  const pct = Math.round((s / STEPS_TOTAL) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `שלב ${Math.min(s,STEPS_TOTAL)} מתוך ${STEPS_TOTAL}`;
}

// ════════════════════════════════════════════
//  AI
// ════════════════════════════════════════════
const AI_SYSTEM = `אתה נציג קבלת פניות של משרד פיננסי המתמחה בפדיון קרנות פנסיה, קופות גמל, קרנות השתלמות, ביטוח מנהלים ופוליסות חיסכון.
תפקידך: לענות בקצרה ובידידותיות לשאלות חופשיות. תמיד בעברית. תשובות קצרות – 2-4 משפטים.
אל תבקש מסמכים – הממשק עושה זאת אוטומטית. אם שואלים על טפסים/תהליך – ענה בקצרה.`;

async function askAI(userMsg) {
  aiHistory.push({ role: 'user', content: userMsg });
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        system: AI_SYSTEM,
        messages: aiHistory
      })
    });
    const d = await r.json();
    const reply = d.content?.[0]?.text || 'מצטער, נסה שוב.';
    aiHistory.push({ role: 'assistant', content: reply });
    return reply;
  } catch(e) { return 'שגיאת חיבור – נסה שנית.'; }
}

// ════════════════════════════════════════════
//  RENDER HELPERS
// ════════════════════════════════════════════
function ts() {
  return new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
}
function scrollEnd() {
  const m = document.getElementById('messages');
  setTimeout(() => m.scrollTop = m.scrollHeight, 60);
}
function setQR(btns) {
  document.getElementById('qrWrap').innerHTML =
    btns.map(b=>`<button class="qr-btn" onclick="handleQR('${b.replace(/'/g,"\\'")}')">
      ${b}</button>`).join('');
}
function clearQR() { document.getElementById('qrWrap').innerHTML = ''; }

function addMsg(html, side='bot', extraClass='') {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = `msg ${side === 'user' ? 'user' : ''}`;
  const av = side === 'user'
    ? `<div class="av user-av">אני</div>`
    : `<div class="av bot">🤖</div>`;
  d.innerHTML = `${av}<div><div class="bubble ${side === 'user' ? 'user' : 'bot'} ${extraClass}">${html}</div><div class="ts">${ts()}</div></div>`;
  m.appendChild(d); scrollEnd(); return d;
}

function addUserMsg(txt) { addMsg(txt.replace(/\n/g,'<br>'), 'user'); }

function showTyping() {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typing';
  d.innerHTML = `<div class="av bot">🤖</div><div class="bubble bot"><div class="dot-w"><span></span><span></span><span></span></div></div>`;
  m.appendChild(d); scrollEnd();
}
function hideTyping() { const t=document.getElementById('typing'); if(t)t.remove(); }

function autoResize(el) {
  el.style.height='auto';
  el.style.height = Math.min(el.scrollHeight,90)+'px';
}
function handleKey(e) {
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFree();}
}

    }, 300);
  }
}

}

// ── UPLOAD CARD ──
function showUpload(field, title, sub, placeholder) {
  const m = document.getElementById('messages');
  const uid = 'upload_' + field;
  const d = document.createElement('div');
  d.className = 'msg'; d.id = uid + '_wrap';
  d.innerHTML = `<div class="av bot" style="opacity:0;width:32px;flex-shrink:0"></div>
  <div style="flex:1;max-width:90%">
    <div class="upload-card" id="${uid}_card">
      <div class="upload-header">
        <div class="upload-icon">${title.slice(0,2)}</div>
        <div><div class="upload-title">${title.slice(3)}</div><div class="upload-sub">${sub}</div></div>
      </div>
      <div class="upload-zone" id="${uid}_zone">
        <input type="file" accept="image/*,application/pdf" onchange="handleFile('${field}','${uid}',this)">
        <div class="zone-icon">📁</div>
        <div class="zone-text">${placeholder}<br><span style="color:var(--blue);font-weight:600">לחץ לבחירת קובץ</span></div>
      </div>
      <div id="${uid}_preview"></div>
      <div class="upload-tip">✔ קבצים מוצפנים ומועברים בצורה מאובטחת</div>
    </div>
    <div class="ts">${ts()}</div>
  </div>`;
  m.appendChild(d); scrollEnd();
}

function handleFile(field, uid, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    alert('הקובץ גדול מ-5MB. אנא דחוס את הקובץ ונסה שנית.');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    state[field] = { name: file.name, dataUrl: e.target.result, type: file.type };

    document.getElementById(uid+'_card').classList.add('has-file');
    document.getElementById(uid+'_zone').style.display = 'none';
    document.getElementById(uid+'_preview').innerHTML = `
      <div class="file-preview">
        <span>✅</span>
        <span class="fp-name">${file.name}</span>
        <span class="fp-remove" onclick="removeFile('${field}','${uid}')">✕</span>
      </div>`;

    setTimeout(() => {
      if (field === 'id_front') {
        // ת"ז ישנה → דלג על הצד האחורי
        if (state.id_type === 'old') {
          state.id_back = null;
          step3_bank();
        } else {
          step2_idBack();
        }
      } else if (field === 'id_back') {
        step3_bank();
      } else if (field === 'bank_doc') {
        step4_details();
      }
    }, 600);
  };
  reader.readAsDataURL(file);
}

function removeFile(field, uid) {
  state[field] = null;
  document.getElementById(uid+'_card').classList.remove('has-file');
  document.getElementById(uid+'_zone').style.display = '';
  document.getElementById(uid+'_preview').innerHTML = '';
}

function clearErr(id) {
  document.getElementById(id).classList.remove('err');
  document.getElementById('err_'+id).style.display = 'none';
}
function showErr(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.classList.add('err'); }
  const er = document.getElementById('err_'+id);
  if (er) { er.textContent = msg||'שדה חובה'; er.style.display = 'block'; }
}

function validateID(id) {
  if (!/^\d{9}$/.test(id)) return false;
  let sum = 0;
  for (let i=0;i<9;i++) {
    let v = +id[i] * ((i%2)+1);
    if(v>9) v-=9; sum+=v;
  }
  return sum%10===0;
}

async function submitLead() {

  const consent = document.getElementById('f_consent').checked;

  let ok = true;

  if (!validateID(idNum)) { showErr('f_id','ת"ז לא תקינה (9 ספרות)'); ok=false; }
  if (!/^0\d{8,9}$/.test(phone.replace(/[-\s]/g,''))) { showErr('f_phone','מספר לא תקין'); ok=false; }

  const btn = document.querySelector('.submit-btn');

  const idTypeLabel = state.id_type === 'old' ? 'ת"ז ישנה (צד אחד)' : 'ת"ז ביומטרית (2 צדדים)';

==========================
שם: ${name}
ת"ז: ${idNum}

אימייל: ${email || '—'}
מוצר: ${state.product}

• סוג ת"ז: ${idTypeLabel}

  // Build HTML email with inline document images

    return '<p><b>' + label + ':</b> ' + docObj.name + '</p>' +

  const idTypeLbl = state.id_type === 'old' ? '\u05ea\u201d\u05d6 \u05d9\u05e9\u05e0\u05d4 (\u05e6\u05d3 \u05d0\u05d7\u05d3)' : '\u05ea\u201d\u05d6 \u05d1\u05d9\u05d5\u05de\u05d8\u05e8\u05d9\u05ea (2 \u05e6\u05d3\u05d3\u05d9\u05dd)';

  const htmlBody =

  // Show success screen – email was sent automatically above

async function sendFree() {
  if (busy) return;
  const inp = document.getElementById('userInput');
  const txt = inp.value.trim(); if (!txt) return;
  busy = true; document.getElementById('sendBtn').disabled = true;
  inp.value = ''; inp.style.height = 'auto';
  clearQR(); addUserMsg(txt); showTyping();
  const reply = await askAI(txt);
  hideTyping(); addMsg(reply.replace(/\n/g,'<br>'));
  busy = false; document.getElementById('sendBtn').disabled = false;
}

function handleQR(txt) { document.getElementById('userInput').value = txt; sendFree(); }
